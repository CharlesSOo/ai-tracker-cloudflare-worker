name: ci

on:
  push:
  pull_request:

# Customers clone main and deploy it in front of their sites: nothing lands unchecked.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy -- --dry-run
      # The collector must stay dependency-free at runtime.
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies ?? {}).length) { console.error('Runtime dependencies are not allowed'); process.exit(1) }"
